<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grammar Fun Videos - Class 6</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        min-height: 100vh;
        padding: 20px;
        overflow-x: hidden;
      }

      .header { text-align: center; margin-bottom: 30px; position: relative; }

      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
      }

      .back-btn:hover {
        background: white;
        transform: translateX(-5px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      h1 { color: white; font-size: 3rem; margin: 40px 0 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.3); }
      .subtitle { color: white; font-size: 1.3rem; margin-bottom: 40px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

      .videos-container {
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 25px;
        padding: 20px;
      }

      .video-card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .video-card:hover { transform: translateY(-8px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }

      .video-thumbnail {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        overflow: hidden;
      }

      .video-thumbnail video {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
      }

      .play-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
      }

      .video-card:hover .play-overlay { background: rgba(0, 0, 0, 0.5); }

      .play-button {
        width: 70px; height: 70px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      .video-card:hover .play-button { transform: scale(1.1); background: white; }
      .play-button svg { width: 30px; height: 30px; margin-left: 4px; }

      .video-info { padding: 15px; }
      .video-title { font-size: 1.1rem; font-weight: bold; color: #333; margin-bottom: 5px; line-height: 1.3; }
      .video-description { font-size: 0.9rem; color: #666; line-height: 1.4; }

      @media (max-width: 768px) {
        h1 { font-size: 2rem; }
        .subtitle { font-size: 1rem; }
        .videos-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .play-button { width: 50px; height: 50px; }
        .play-button svg { width: 20px; height: 20px; }
        .video-title { font-size: 1rem; }
        .video-description { font-size: 0.85rem; }
      }
    </style>
  </head>
  <body>
    <button class="back-btn" onclick="window.history.back()">&#8592; Back</button>

    <div class="header">
      <h1>&#127916; Grammar Fun Videos - Class 6 &#128218;</h1>
      <p class="subtitle">Click on any topic to watch and learn!</p>
    </div>

    <div class="videos-container" id="videos-container"></div>

    <script>
      const BASE = '../assets/videos/';

      const VIDEOS = [
        { file: 'The Sentence.mp4',                        desc: 'Structure of a sentence!' },
        { file: 'Subject and Predicate.mp4',               desc: 'Parts of a sentence!' },
        { file: 'Nouns.mp4',                               desc: 'Naming words!' },
        { file: 'Nouns - Number.mp4',                       desc: 'Singular and plural nouns!' },
        { file: 'Nouns - Gender.mp4',                       desc: 'Gender of nouns!' },
        { file: 'Nouns - Case.mp4',                         desc: 'Learn about noun cases!' },
        { file: 'Articles.mp4',                             desc: 'A, an, and the explained!' },
        { file: 'Pronouns.mp4',                             desc: 'Replacing nouns!' },
        { file: 'Pronouns - Number, Gender and Case.mp4',   desc: 'Pronoun forms explained!' },
        { file: 'Adjectives.mp4',                          desc: 'Describing words and their types!' },
        { file: 'Comparison of Adjectives.mp4',            desc: 'Positive, comparative, superlative!' },
        { file: 'Kinds of Verbs.mp4',                      desc: 'Different types of verbs explained!' },
        { file: 'Simple Tense.mp4',                        desc: 'Past, present, and future!' },
        { file: 'Continuous Tense.mp4',                    desc: 'Ongoing actions!' },
        { file: 'Perfect Tense.mp4',                       desc: 'Perfect aspects of time!' },
        { file: 'Adverbs.mp4',                             desc: 'Modify verbs, adjectives, and more!' },
        { file: 'Prepositions.mp4',                        desc: 'Words showing relationships!' },
        { file: 'Conjunctions.mp4',                        desc: 'Connect words and clauses!' },
        { file: 'Phrases and Clauses.mp4',                 desc: 'Building blocks of sentences!' },
        { file: 'Interjections.mp4',                       desc: 'Expressing emotions!' },
        { file: 'Active and Passive Voice.mp4',            desc: 'Active and passive sentences!' },
        { file: 'Subject-Verb Agreement.mp4',              desc: 'Subjects and verbs must agree!' },
        { file: 'Direct and Indirect Speech.mp4',          desc: 'Reported speech explained!' },
        { file: 'Idioms.mp4',                              desc: 'Common expressions!' },
        { file: 'Words Often Confused.mp4',                desc: 'Commonly mixed-up words!' },
        { file: 'Phrasal Verbs.mp4',                       desc: 'Verb and preposition combinations!' },
        { file: 'Similes and Metaphors.mp4',               desc: 'Figures of speech!' },
        { file: 'The Rainbow.mp4',                         desc: 'A colourful poem!' },
        { file: 'Daffodils.mp4',                           desc: 'A classic poem!' },
        { file: 'The Injured Bird.mp4',                    desc: 'A touching story!' },
      ];

      const PLAY_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;

      function buildGrid() {
        const container = document.getElementById('videos-container');
        VIDEOS.forEach(({ file }, i) => {
          const title = file.replace('.mp4', '');
          const path = BASE + file;
          container.innerHTML += `
            <div class="video-card" onclick="playVideo('${path.replace(/'/g, "\\'")}')">
              <div class="video-thumbnail">
                <video preload="metadata" muted>
                  <source src="${path}" type="video/mp4" />
                </video>
                <div class="play-overlay">
                  <div class="play-button">${PLAY_SVG}</div>
                </div>
              </div>
              <div class="video-info">
                <h3 class="video-title">${title}</h3>
                <p class="video-description">Chapter ${i + 1}</p>
              </div>
            </div>`;
        });
      }

      function playVideo(videoPath) {
        window.open(encodeURI(videoPath));
      }

      buildGrid();

      document.addEventListener('DOMContentLoaded', function () {
        const videos = document.querySelectorAll('.video-thumbnail video');
        videos.forEach(video => {
          video.load();
          video.addEventListener('loadedmetadata', function () { this.currentTime = 0.5; });
          video.addEventListener('loadeddata', function () {
            if (this.currentTime === 0) this.currentTime = 0.5;
          });
        });
      });
    </script>
  </body>
</html>
