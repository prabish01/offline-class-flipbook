<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Good with Grammar</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        padding: 50px 40px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        text-align: center;
        max-width: 640px;
        width: 100%;
      }

      h1 { color: #667eea; font-size: 2.2em; margin-bottom: 8px; }
      .subtitle { color: #666; font-size: 1.1em; margin-bottom: 36px; }

      .classes-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }

      .class-btn {
        display: block;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        padding: 22px 10px;
        border-radius: 14px;
        font-size: 1.1em;
        font-weight: bold;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 12px rgba(102,126,234,0.35);
      }

      .class-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(102,126,234,0.5);
      }

      .class-btn span {
        display: block;
        font-size: 0.72em;
        font-weight: normal;
        opacity: 0.85;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Good with Grammar</h1>
      <p class="subtitle">Select your class to start learning</p>

      <div class="classes-grid">
        <a href="class-1/index.html" class="class-btn">Class 1<span>Grammar</span></a>
        <a href="class-2/index.html" class="class-btn">Class 2<span>Grammar</span></a>
        <a href="class-3/index.html" class="class-btn">Class 3<span>Grammar</span></a>
        <a href="class-4/index.html" class="class-btn">Class 4<span>Grammar</span></a>
        <a href="class-5/index.html" class="class-btn">Class 5<span>Grammar</span></a>
        <a href="class-6/index.html" class="class-btn">Class 6<span>Grammar</span></a>
        <a href="class-7/index.html" class="class-btn">Class 7<span>Grammar</span></a>
        <a href="class-8/index.html" class="class-btn">Class 8<span>Grammar</span></a>
      </div>
    </div>
  </body>
</html>
