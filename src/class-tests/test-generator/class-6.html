<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Generator - Class 6</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      }

      .back-btn:hover {
        background: white;
        transform: translateX(-5px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      h1 {
        color: white;
        font-size: 2.5rem;
        margin: 40px 0 10px;
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
      }

      .subtitle {
        color: white;
        font-size: 1.2rem;
        margin-bottom: 30px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .test-info {
        background: white;
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }

      .test-info h2 {
        color: #667eea;
        margin-bottom: 20px;
        font-size: 1.8rem;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      .info-field {
        display: flex;
        flex-direction: column;
      }

      .info-field label {
        color: #333;
        font-weight: bold;
        margin-bottom: 8px;
        font-size: 1.1rem;
      }

      .info-field input,
      .info-field select {
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        font-family: "Comic Sans MS", cursive;
        transition: border-color 0.3s ease;
      }

      .info-field input:focus,
      .info-field select:focus {
        outline: none;
        border-color: #667eea;
      }

      .chapters-section {
        background: white;
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }

      .chapters-section h2 {
        color: #667eea;
        margin-bottom: 20px;
        font-size: 1.8rem;
      }

      .chapters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
      }

      .chapter-card {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        border-radius: 15px;
        padding: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
      }

      .chapter-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      .chapter-card input[type="checkbox"] {
        display: none;
      }

      .chapter-card:has(input:checked) {
        background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
        box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
      }

      .chapter-card:has(input:checked)::after {
        content: "✓";
        position: absolute;
        top: 15px;
        right: 15px;
        font-size: 2rem;
        color: white;
        font-weight: bold;
      }

      .chapter-card h3 {
        color: white;
        font-size: 1.3rem;
        margin-bottom: 8px;
      }

      .chapter-card p {
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.9rem;
      }

      .chapter-number {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.85rem;
        font-weight: bold;
      }

      .action-buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      .btn {
        padding: 15px 40px;
        font-size: 1.2rem;
        font-weight: bold;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        font-family: "Comic Sans MS", cursive;
      }

      .btn-preview {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-preview:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }

      .btn-print {
        background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
        color: white;
      }

      .btn-print:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(0, 184, 148, 0.4);
      }

      /* Print Styles */
      @media print {
        body {
          background: white;
          padding: 0;
          margin: 0;
        }

        .back-btn,
        .test-info,
        .chapters-section,
        .action-buttons,
        .subtitle,
        .header h1,
        .header {
          display: none !important;
        }

        h1 {
          color: #333;
          text-shadow: none;
        }

        .container {
          margin: 0 !important;
          padding: 0 !important;
        }

        .test-preview {
          border-radius: 0 !important;
          box-shadow: none !important;
          padding: 0 !important;
          margin: 0 !important;
          background: white !important;
        }

        .test-header {
          border: none !important;
          padding-bottom: 10px !important;
          margin-bottom: 15px !important;
          margin-top: 0 !important;
        }

        .test-header h2 {
          font-size: 1.5rem !important;
          margin-top: 0 !important;
        }

        .test-details {
          font-size: 0.85rem !important;
        }

        .question-section {
          page-break-inside: avoid;
          margin-bottom: 20px !important;
        }

        .question-section h3 {
          display: none !important;
        }

        .question {
          border-radius: 0 !important;
          padding: 10px 0 !important;
          margin-bottom: 15px !important;
          page-break-inside: avoid;
          background: white !important;
          border: none !important;
        }

        .question img {
          max-width: 55% !important;
          max-height: 400px !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          display: block;
          margin: 10px auto !important;
          page-break-inside: avoid;
        }

        .answer {
          border-radius: 0 !important;
          padding: 5px 0 !important;
          font-size: 0.9rem !important;
          background: white !important;
        }
      }

      .test-preview {
        background: white;
        border-radius: 20px;
        padding: 40px;
        margin-top: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        display: none;
      }

      .test-preview.show {
        display: block;
      }

      .test-header {
        text-align: center;
        border-bottom: 3px solid #667eea;
        padding-bottom: 20px;
        margin-bottom: 30px;
      }

      .test-header h2 {
        color: #667eea;
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .test-details {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 15px;
        font-size: 1rem;
        color: #666;
      }

      .question-section {
        margin-bottom: 40px;
      }

      .question-section h3 {
        color: #667eea;
        font-size: 1.5rem;
        margin-bottom: 20px;
        padding: 10px;
        background: #f0f0f0;
        border-radius: 10px;
      }

      .question {
        margin-bottom: 30px;
        padding: 20px;
        border-left: 4px solid #667eea;
        background: #f9f9f9;
        border-radius: 10px;
      }

      .question img {
        max-width: 100%;
        height: auto;
        margin: 15px 0;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .answer {
        color: #00b894;
        font-weight: bold;
        margin-top: 10px;
        padding: 10px;
        background: #e8f8f5;
        border-radius: 5px;
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2rem;
        }

        .info-grid,
        .chapters-grid {
          grid-template-columns: 1fr;
        }

        .action-buttons {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>

      function previewTest() {
        const testName = document.getElementById("testName").value || "Grammar Test";
        const studentName = document.getElementById("studentName").value;
        const testDate = document.getElementById("testDate").value;

        document.getElementById("previewTestName").textContent = testName;
        const testDuration = document.getElementById("testDuration").value;
        const totalMarks = document.getElementById("totalMarks").value;
        const questionType = document.getElementById("questionType").value;

        document.getElementById("previewTestName").textContent = testName;
        document.getElementById("previewStudentName").textContent = studentName || "_________________";
        document.getElementById("previewDate").textContent = testDate || "_________________";

        const questionsContainer = document.getElementById("questionsContainer");
        questionsContainer.innerHTML = "";

        let questionNumber = 1;
        const selectedChapters = document.querySelectorAll(".chapter-card:has(input:checked)");

        if (selectedChapters.length === 0) {
          alert("Please select at least one chapter!");
          return;
        }

        selectedChapters.forEach((card) => {
          const chapterId = card.dataset.chapter;
          if (questions[chapterId]) {
            const sectionDiv = document.createElement("div");
            sectionDiv.className = "question-section";

            const chapterType = card.dataset.type;
            const chapterTitle = card.querySelector("h3").textContent;

            let sectionLabel = "";
            if (chapterType === "grammar") sectionLabel = "📝 Grammar";
            else if (chapterType === "vocabulary") sectionLabel = "📚 Vocabulary";

            sectionDiv.innerHTML = `<h3>${sectionLabel} - ${chapterTitle}</h3>`;

            questions[chapterId].forEach((q) => {
              const questionDiv = document.createElement("div");
              questionDiv.className = "question";

              let questionHTML = `<p><strong>Q${questionNumber}.</strong> ${q.text}</p>`;

              q.images.forEach((img) => {
                questionHTML += `<img src="${img}" alt="Question Image">`;
              });

              // Show answer only for teacher version
              if (questionType === "teacher") {
                questionHTML += `<div class="answer">Answer: ${q.answer}</div>`;
              }

              questionDiv.innerHTML = questionHTML;
              sectionDiv.appendChild(questionDiv);
              questionNumber++;
            });

            questionsContainer.appendChild(sectionDiv);
          }
        });

        document.getElementById("testPreview").classList.add("show");
        document.getElementById("testPreview").scrollIntoView({ behavior: "smooth" });
      }

      function printTest() {
        previewTest();
        setTimeout(() => {
          window.print();
        }, 500);
      }
    </script>
