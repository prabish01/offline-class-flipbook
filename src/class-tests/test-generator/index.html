<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Generator - Class 1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      }

      .back-btn:hover {
        background: white;
        transform: translateX(-5px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      h1 {
        color: white;
        font-size: 2.5rem;
        margin: 40px 0 10px;
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
      }

      .subtitle {
        color: white;
        font-size: 1.2rem;
        margin-bottom: 30px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .test-info {
        background: white;
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }

      .test-info h2 {
        color: #667eea;
        margin-bottom: 20px;
        font-size: 1.8rem;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      .info-field {
        display: flex;
        flex-direction: column;
      }

      .info-field label {
        color: #333;
        font-weight: bold;
        margin-bottom: 8px;
        font-size: 1.1rem;
      }

      .info-field input,
      .info-field select {
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        font-family: "Comic Sans MS", cursive;
        transition: border-color 0.3s ease;
      }

      .info-field input:focus,
      .info-field select:focus {
        outline: none;
        border-color: #667eea;
      }

      .chapters-section {
        background: white;
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }

      .chapters-section h2 {
        color: #667eea;
        margin-bottom: 20px;
        font-size: 1.8rem;
      }

      .chapters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
      }

      .chapter-card {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        border-radius: 15px;
        padding: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
      }

      .chapter-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      .chapter-card input[type="checkbox"] {
        display: none;
      }

      .chapter-card:has(input:checked) {
        background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
        box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
      }

      .chapter-card:has(input:checked)::after {
        content: "✓";
        position: absolute;
        top: 15px;
        right: 15px;
        font-size: 2rem;
        color: white;
        font-weight: bold;
      }

      .chapter-card h3 {
        color: white;
        font-size: 1.3rem;
        margin-bottom: 8px;
      }

      .chapter-card p {
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.9rem;
      }

      .chapter-number {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.85rem;
        font-weight: bold;
      }

      .action-buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      .btn {
        padding: 15px 40px;
        font-size: 1.2rem;
        font-weight: bold;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        font-family: "Comic Sans MS", cursive;
      }

      .btn-preview {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-preview:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }

      .btn-print {
        background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
        color: white;
      }

      .btn-print:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(0, 184, 148, 0.4);
      }

      /* Print Styles */
      @media print {
        body {
          background: white;
          padding: 0;
          margin: 0;
        }

        .back-btn,
        .test-info,
        .chapters-section,
        .action-buttons,
        .subtitle,
        .header h1,
        .header {
          display: none !important;
        }

        h1 {
          color: #333;
          text-shadow: none;
        }

        .container {
          margin: 0 !important;
          padding: 0 !important;
        }

        .test-preview {
          border-radius: 0 !important;
          box-shadow: none !important;
          padding: 0 !important;
          margin: 0 !important;
          background: white !important;
        }

        .test-header {
          border: none !important;
          padding-bottom: 10px !important;
          margin-bottom: 15px !important;
          margin-top: 0 !important;
        }

        .test-header h2 {
          font-size: 1.5rem !important;
          margin-top: 0 !important;
        }

        .test-details {
          font-size: 0.85rem !important;
        }

        .question-section {
          page-break-inside: avoid;
          margin-bottom: 20px !important;
        }

        .question-section h3 {
          display: none !important;
        }

        .question {
          border-radius: 0 !important;
          padding: 10px 0 !important;
          margin-bottom: 15px !important;
          page-break-inside: avoid;
          background: white !important;
          border: none !important;
        }

        .question ol {
          margin-left: 25px !important;
          font-size: 0.95rem !important;
        }

        .question ol li {
          margin-bottom: 6px !important;
        }

        .question img {
          max-width: 55% !important;
          max-height: 400px !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          display: block;
          margin: 10px auto !important;
          page-break-inside: avoid;
        }

        .answer {
          border-radius: 0 !important;
          padding: 5px 0 !important;
          font-size: 0.9rem !important;
          background: white !important;
        }
      }

      .test-preview {
        background: white;
        border-radius: 20px;
        padding: 40px;
        margin-top: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        display: none;
      }

      .test-preview.show {
        display: block;
      }

      .test-header {
        text-align: center;
        border-bottom: 3px solid #667eea;
        padding-bottom: 20px;
        margin-bottom: 30px;
      }

      .test-header h2 {
        color: #667eea;
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .test-details {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 15px;
        font-size: 1rem;
        color: #666;
      }

      .question-section {
        margin-bottom: 40px;
      }

      .question-section h3 {
        color: #667eea;
        font-size: 1.5rem;
        margin-bottom: 20px;
        padding: 10px;
        background: #f0f0f0;
        border-radius: 10px;
      }

      .question {
        margin-bottom: 30px;
        padding: 20px;
        border-left: 4px solid #667eea;
        background: #f9f9f9;
        border-radius: 10px;
      }

      .question ol {
        font-size: 1rem;
        line-height: 1.8;
        color: #333;
      }

      .question ol li {
        margin-bottom: 10px;
      }

      .question img {
        max-width: 100%;
        height: auto;
        margin: 15px 0;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .answer {
        color: #00b894;
        font-weight: bold;
        margin-top: 10px;
        padding: 10px;
        background: #e8f8f5;
        border-radius: 5px;
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2rem;
        }

        .info-grid,
        .chapters-grid {
          grid-template-columns: 1fr;
        }

        .action-buttons {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <button class="back-btn" onclick="window.history.back()">← Back</button>

    <div class="header">
      <h1>📝 Test Generator</h1>
      <p class="subtitle">Create a custom test by selecting chapters</p>
    </div>

    <div class="container">
      <!-- Test Information -->
      <div class="test-info">
        <h2>📋 Test Information</h2>
        <div class="info-grid">
          <div class="info-field">
            <label for="testName">Test Name</label>
            <input type="text" id="testName" placeholder="e.g., Grammar Quiz 1" value="Grammar Test - Class 1" />
          </div>
          <div class="info-field">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" placeholder="Student's Name" />
          </div>
          <div class="info-field">
            <label for="testDate">Date</label>
            <input type="date" id="testDate" />
          </div>
          <div class="info-field">
            <label for="testDuration">Test Duration (mins)</label>
            <input type="number" id="testDuration" placeholder="e.g., 60" value="60" />
          </div>
          <div class="info-field">
            <label for="totalMarks">Total Marks</label>
            <input type="number" id="totalMarks" placeholder="e.g., 100" value="100" />
          </div>
          <div class="info-field">
            <label for="questionType">Question Type</label>
            <select id="questionType">
              <option value="teacher">Teacher (with answers)</option>
              <option value="student">Student (without answers)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Chapters Selection -->
      <div class="chapters-section">
        <h2>📚 Select Topics</h2>

        <!-- Grammar Section -->
        <h3 style="color: #667eea; margin: 30px 0 15px 0; font-size: 1.5rem; font-weight: bold">📝 Grammar</h3>
        <div class="chapters-grid">
          <label class="chapter-card" data-chapter="g1" data-type="grammar">
            <input type="checkbox" id="g1" />
            <span class="chapter-number">Grammar 1</span>
            <h3>Naming Words – People</h3>
            <p>Nouns for people</p>
          </label>

          <label class="chapter-card" data-chapter="g2" data-type="grammar">
            <input type="checkbox" id="g2" />
            <span class="chapter-number">Grammar 2</span>
            <h3>Naming Words – Places</h3>
            <p>Nouns for places</p>
          </label>

          <label class="chapter-card" data-chapter="g3" data-type="grammar">
            <input type="checkbox" id="g3" />
            <span class="chapter-number">Grammar 3</span>
            <h3>Naming Words – Animals</h3>
            <p>Nouns for animals</p>
          </label>

          <label class="chapter-card" data-chapter="g4" data-type="grammar">
            <input type="checkbox" id="g4" />
            <span class="chapter-number">Grammar 4</span>
            <h3>Naming Words – Things</h3>
            <p>Nouns for things</p>
          </label>

          <label class="chapter-card" data-chapter="g5" data-type="grammar">
            <input type="checkbox" id="g5" />
            <span class="chapter-number">Grammar 5</span>
            <h3>Naming Words – Revision</h3>
            <p>Review all nouns</p>
          </label>

          <label class="chapter-card" data-chapter="g6" data-type="grammar">
            <input type="checkbox" id="g6" />
            <span class="chapter-number">Grammar 6</span>
            <h3>One and Many</h3>
            <p>Singular and plural</p>
          </label>

          <label class="chapter-card" data-chapter="g7" data-type="grammar">
            <input type="checkbox" id="g7" />
            <span class="chapter-number">Grammar 7</span>
            <h3>A or An</h3>
            <p>Articles</p>
          </label>

          <label class="chapter-card" data-chapter="g8" data-type="grammar">
            <input type="checkbox" id="g8" />
            <span class="chapter-number">Grammar 8</span>
            <h3>This is or That is</h3>
            <p>Demonstratives singular</p>
          </label>

          <label class="chapter-card" data-chapter="g9" data-type="grammar">
            <input type="checkbox" id="g9" />
            <span class="chapter-number">Grammar 9</span>
            <h3>These are or Those are</h3>
            <p>Demonstratives plural</p>
          </label>

          <label class="chapter-card" data-chapter="g10" data-type="grammar">
            <input type="checkbox" id="g10" />
            <span class="chapter-number">Grammar 10</span>
            <h3>Male or Female – People</h3>
            <p>Gender for people</p>
          </label>

          <label class="chapter-card" data-chapter="g11" data-type="grammar">
            <input type="checkbox" id="g11" />
            <span class="chapter-number">Grammar 11</span>
            <h3>Male or Female – Animals</h3>
            <p>Gender for animals</p>
          </label>

          <label class="chapter-card" data-chapter="g12" data-type="grammar">
            <input type="checkbox" id="g12" />
            <span class="chapter-number">Grammar 12</span>
            <h3>Pronouns</h3>
            <p>I, you, he, she, etc.</p>
          </label>

          <label class="chapter-card" data-chapter="g13" data-type="grammar">
            <input type="checkbox" id="g13" />
            <span class="chapter-number">Grammar 13</span>
            <h3>Describing Words</h3>
            <p>Adjectives</p>
          </label>

          <label class="chapter-card" data-chapter="g14" data-type="grammar">
            <input type="checkbox" id="g14" />
            <span class="chapter-number">Grammar 14</span>
            <h3>Action Words</h3>
            <p>Verbs</p>
          </label>

          <label class="chapter-card" data-chapter="g15" data-type="grammar">
            <input type="checkbox" id="g15" />
            <span class="chapter-number">Grammar 15</span>
            <h3>Being Verbs</h3>
            <p>Is, am, are</p>
          </label>

          <label class="chapter-card" data-chapter="g16" data-type="grammar">
            <input type="checkbox" id="g16" />
            <span class="chapter-number">Grammar 16</span>
            <h3>Having Verbs</h3>
            <p>Has, have</p>
          </label>

          <label class="chapter-card" data-chapter="g17" data-type="grammar">
            <input type="checkbox" id="g17" />
            <span class="chapter-number">Grammar 17</span>
            <h3>Actions that Happen Every Day</h3>
            <p>Present tense</p>
          </label>

          <label class="chapter-card" data-chapter="g19" data-type="grammar">
            <input type="checkbox" id="g19" />
            <span class="chapter-number">Grammar 19</span>
            <h3>The Sentence</h3>
            <p>Sentence structure</p>
          </label>

          <label class="chapter-card" data-chapter="g20" data-type="grammar">
            <input type="checkbox" id="g20" />
            <span class="chapter-number">Grammar 20</span>
            <h3>Statements and Questions</h3>
            <p>Types of sentences</p>
          </label>

          <label class="chapter-card" data-chapter="g21" data-type="grammar">
            <input type="checkbox" id="g21" />
            <span class="chapter-number">Grammar 21</span>
            <h3>Joining Words</h3>
            <p>Conjunctions</p>
          </label>

          <label class="chapter-card" data-chapter="g22" data-type="grammar">
            <input type="checkbox" id="g22" />
            <span class="chapter-number">Grammar 22</span>
            <h3>Position Words</h3>
            <p>Prepositions</p>
          </label>
        </div>

        <!-- Comprehension Section -->
        <h3 style="color: #667eea; margin: 30px 0 15px 0; font-size: 1.5rem; font-weight: bold">📖 Comprehension</h3>
        <div class="chapters-grid">
          <label class="chapter-card" data-chapter="c1" data-type="comprehension">
            <input type="checkbox" id="c1" />
            <span class="chapter-number">Comprehension 1</span>
            <h3>Diwali</h3>
            <p>Reading comprehension</p>
          </label>

          <label class="chapter-card" data-chapter="c2" data-type="comprehension">
            <input type="checkbox" id="c2" />
            <span class="chapter-number">Comprehension 2</span>
            <h3>The Ant and the Grasshopper</h3>
            <p>Reading comprehension</p>
          </label>

          <label class="chapter-card" data-chapter="c3" data-type="comprehension">
            <input type="checkbox" id="c3" />
            <span class="chapter-number">Comprehension 3</span>
            <h3>The Lion</h3>
            <p>Reading comprehension</p>
          </label>

          <label class="chapter-card" data-chapter="c4" data-type="comprehension">
            <input type="checkbox" id="c4" />
            <span class="chapter-number">Comprehension 4</span>
            <h3>The Monsoon Season</h3>
            <p>Reading comprehension</p>
          </label>

          <label class="chapter-card" data-chapter="c5" data-type="comprehension">
            <input type="checkbox" id="c5" />
            <span class="chapter-number">Comprehension 5</span>
            <h3>Picture Comprehension</h3>
            <p>Visual comprehension</p>
          </label>
        </div>

        <!-- Vocabulary Section -->
        <h3 style="color: #667eea; margin: 30px 0 15px 0; font-size: 1.5rem; font-weight: bold">📚 Vocabulary</h3>
        <div class="chapters-grid">
          <label class="chapter-card" data-chapter="v1" data-type="vocabulary">
            <input type="checkbox" id="v1" />
            <span class="chapter-number">Vocabulary 1</span>
            <h3>Alphabetical Order</h3>
            <p>ABC ordering</p>
          </label>

          <label class="chapter-card" data-chapter="v2" data-type="vocabulary">
            <input type="checkbox" id="v2" />
            <span class="chapter-number">Vocabulary 2</span>
            <h3>Opposites</h3>
            <p>Antonyms</p>
          </label>

          <label class="chapter-card" data-chapter="v3" data-type="vocabulary">
            <input type="checkbox" id="v3" />
            <span class="chapter-number">Vocabulary 3</span>
            <h3>Similar Words</h3>
            <p>Synonyms</p>
          </label>

          <label class="chapter-card" data-chapter="v4" data-type="vocabulary">
            <input type="checkbox" id="v4" />
            <span class="chapter-number">Vocabulary 4</span>
            <h3>Compound Words</h3>
            <p>Combined words</p>
          </label>

          <label class="chapter-card" data-chapter="v5" data-type="vocabulary">
            <input type="checkbox" id="v5" />
            <span class="chapter-number">Vocabulary 5</span>
            <h3>One-word Substitution</h3>
            <p>Replace phrases</p>
          </label>

          <label class="chapter-card" data-chapter="v6" data-type="vocabulary">
            <input type="checkbox" id="v6" />
            <span class="chapter-number">Vocabulary 6</span>
            <h3>Homes of Animals</h3>
            <p>Animal habitats</p>
          </label>

          <label class="chapter-card" data-chapter="v7" data-type="vocabulary">
            <input type="checkbox" id="v7" />
            <span class="chapter-number">Vocabulary 7</span>
            <h3>Sounds of Animals</h3>
            <p>Animal sounds</p>
          </label>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="btn btn-preview" onclick="previewTest()">👁️ Preview Test</button>
        <button class="btn btn-print" onclick="printTest()">🖨️ Print Test</button>
      </div>

      <!-- Test Preview -->
      <div class="test-preview" id="testPreview">
        <div class="test-header">
          <h2 id="previewTestName">Grammar Test - Class 1</h2>
          <div class="test-details">
            <span><strong>Name:</strong> <span id="previewStudentName">_________________</span></span>
            <span><strong>Date:</strong> <span id="previewDate">_________________</span></span>
            <span><strong>Score:</strong> _____ / _____</span>
          </div>
        </div>
        <div id="questionsContainer"></div>
      </div>
    </div>

    <script>
      // Set today's date
      document.getElementById("testDate").valueAsDate = new Date();

      // Question database
      const questions = {
        g1: [
          { text: "Fill in the blanks with letters to complete the names of these people.", images: ["../../../assets/images/test-generator/class-1/Grammar - Chapter 1 A.png"], answer: "Complete the exercises" },
          { text: "Who will help you with these jobs? Match the pictures of these people with their jobs.", images: ["../../../assets/images/test-generator/class-1/Grammar - Chapter 1 B.png"], answer: "Complete the exercises" },
        ],
        g2: [
          { text: "Write the names of these places. Choose the words from the box.", images: ["../../../assets/images/test-generator/class-1/Grammar - Chapter 2 A.png"], answer: "Complete the exercises" },
          { text: "Match the people with the places they work at.", images: ["../../../assets/images/test-generator/class-1/Grammar - Chapter 2 B.png"], answer: "Complete the exercises" },
        ],
        g3: [
          { text: "Unscramble the letters and find the names of these animals.", images: ["../../../assets/images/test-generator/class-1/Grammar - Chapter 3 A.png"], answer: "Complete the exercises" },
          { text: "Help these animals reach their homes.", images: ["../../../assets/images/test-generator/class-1/Grammar - Chapter 3 B.png"], answer: "Complete the exercises" },
        ],
        g4: [{ text: "Answer these questions.", images: ["../../../assets/images/test-generator/class-1/Grammar - Chapter 4 A.png"], answer: "Complete the exercises" }],
        g5: [
          { text: "Find the odd one in each set.", images: ["../../../assets/images/test-generator/class-1/Grammar - Chapter 5 A.png"], answer: "Complete the exercises" },
          { text: "Look at the pictures. Choose the correct kind of naming word for each picture.", images: ["../../../assets/images/test-generator/class-1/Grammar - Chapter 5 B.png"], answer: "Complete the exercises" },
        ],

      // Fisher-Yates shuffle algorithm
      function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function previewTest() {
        const testName = document.getElementById("testName").value || "Grammar Test";
        const studentName = document.getElementById("studentName").value;
        const testDate = document.getElementById("testDate").value;

        document.getElementById("previewTestName").textContent = testName;
        const testDuration = document.getElementById("testDuration").value;
        const totalMarks = document.getElementById("totalMarks").value;
        const questionType = document.getElementById("questionType").value;

        document.getElementById("previewTestName").textContent = testName;
        document.getElementById("previewStudentName").textContent = studentName || "_________________";
        document.getElementById("previewDate").textContent = testDate || "_________________";

        const questionsContainer = document.getElementById("questionsContainer");
        questionsContainer.innerHTML = "";

        let questionNumber = 1;
        const selectedChapters = document.querySelectorAll(".chapter-card:has(input:checked)");

        if (selectedChapters.length === 0) {
          alert("Please select at least one chapter!");
          return;
        }

        // Collect all questions from selected chapters into a pool
        const pool = [];
        selectedChapters.forEach((card) => {
          const chapterId = card.dataset.chapter;
          const chapterType = card.dataset.type;
          const chapterTitle = card.querySelector("h3").textContent;

          if (questions[chapterId]) {
            questions[chapterId].forEach((q) => {
              pool.push({
                chapterId: chapterId,
                chapterType: chapterType,
                chapterTitle: chapterTitle,
                questionData: q,
              });
            });
          }
        });

        // Shuffle the question pool
        const shuffledPool = shuffleArray(pool);

        // Render shuffled questions
        shuffledPool.forEach((item) => {
          const questionDiv = document.createElement("div");
          questionDiv.className = "question";

          const q = item.questionData;

          let sectionLabel = "";
          if (item.chapterType === "grammar") sectionLabel = "📝 Grammar";
          else if (item.chapterType === "comprehension") sectionLabel = "📖 Comprehension";
          else if (item.chapterType === "vocabulary") sectionLabel = "📚 Vocabulary";

          let questionHTML = `<p><strong>Q${questionNumber}.</strong> ${q.text}</p>`;

          // Handle text-based questions
          if (q.questions && Array.isArray(q.questions)) {
            questionHTML += '<ol style="margin-left: 20px; margin-top: 10px;">';
            q.questions.forEach((qItem, index) => {
              questionHTML += `<li style="margin-bottom: 8px;">${qItem}</li>`;
            });
            questionHTML += "</ol>";
          }

          // Handle image-based questions
          if (q.images && Array.isArray(q.images)) {
            q.images.forEach((img) => {
              if (img.endsWith(".pdf")) {
                questionHTML += `<embed src="${img}" type="application/pdf" width="100%" height="600px" style="border:none; border-radius:10px; margin:15px 0;">`;
              } else {
                questionHTML += `<img src="${img}" alt="Question Image">`;
              }
            });
          }

          // Show answer only for teacher version
          if (questionType === "teacher") {
            questionHTML += `<div class="answer">Answer: ${q.answer}</div>`;
          }

          questionDiv.innerHTML = questionHTML;
          questionsContainer.appendChild(questionDiv);
          questionNumber++;
        });

        document.getElementById("testPreview").classList.add("show");
        document.getElementById("testPreview").scrollIntoView({ behavior: "smooth" });
      }

      function printTest() {
        previewTest();
        setTimeout(() => {
          window.print();
        }, 500);
      }
