<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Generator - Class 2</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      }

      .back-btn:hover {
        background: white;
        transform: translateX(-5px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      h1 {
        color: white;
        font-size: 2.5rem;
        margin: 40px 0 10px;
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
      }

      .subtitle {
        color: white;
        font-size: 1.2rem;
        margin-bottom: 30px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .test-info {
        background: white;
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }

      .test-info h2 {
        color: #667eea;
        margin-bottom: 20px;
        font-size: 1.8rem;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      .info-field {
        display: flex;
        flex-direction: column;
      }

      .info-field label {
        color: #333;
        font-weight: bold;
        margin-bottom: 8px;
        font-size: 1.1rem;
      }

      .info-field input,
      .info-field select {
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        font-family: "Comic Sans MS", cursive;
        transition: border-color 0.3s ease;
      }

      .info-field input:focus,
      .info-field select:focus {
        outline: none;
        border-color: #667eea;
      }

      .chapters-section {
        background: white;
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }

      .chapters-section h2 {
        color: #667eea;
        margin-bottom: 20px;
        font-size: 1.8rem;
      }

      .chapters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
      }

      .chapter-card {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        border-radius: 15px;
        padding: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
      }

      .chapter-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      .chapter-card input[type="checkbox"] {
        display: none;
      }

      .chapter-card:has(input:checked) {
        background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
        box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
      }

      .chapter-card:has(input:checked)::after {
        content: "✓";
        position: absolute;
        top: 15px;
        right: 15px;
        font-size: 2rem;
        color: white;
        font-weight: bold;
      }

      .chapter-card h3 {
        color: white;
        font-size: 1.3rem;
        margin-bottom: 8px;
      }

      .chapter-card p {
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.9rem;
      }

      .chapter-number {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.85rem;
        font-weight: bold;
      }

      .action-buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      .btn {
        padding: 15px 40px;
        font-size: 1.2rem;
        font-weight: bold;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        font-family: "Comic Sans MS", cursive;
      }

      .btn-preview {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-preview:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }

      .btn-print {
        background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
        color: white;
      }

      .btn-print:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(0, 184, 148, 0.4);
      }

      /* Print Styles */
      @media print {
        body {
          background: white;
          padding: 0;
          margin: 0;
        }

        .back-btn,
        .test-info,
        .chapters-section,
        .action-buttons,
        .subtitle,
        .header h1,
        .header {
          display: none !important;
        }

        h1 {
          color: #333;
          text-shadow: none;
        }

        .container {
          margin: 0 !important;
          padding: 0 !important;
        }

        .test-preview {
          border-radius: 0 !important;
          box-shadow: none !important;
          padding: 0 !important;
          margin: 0 !important;
          background: white !important;
        }

        .test-header {
          border: none !important;
          padding-bottom: 10px !important;
          margin-bottom: 15px !important;
          margin-top: 0 !important;
        }

        .test-header h2 {
          font-size: 1.5rem !important;
          margin-top: 0 !important;
        }

        .test-details {
          font-size: 0.85rem !important;
        }

        .question-section {
          page-break-inside: avoid;
          margin-bottom: 20px !important;
        }

        .question-section h3 {
          display: none !important;
        }

        .question {
          border-radius: 0 !important;
          padding: 10px 0 !important;
          margin-bottom: 15px !important;
          page-break-inside: avoid;
          background: white !important;
          border: none !important;
        }

        .question img {
          max-width: 55% !important;
          max-height: 400px !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          display: block;
          margin: 10px auto !important;
          page-break-inside: avoid;
        }

        .answer {
          border-radius: 0 !important;
          padding: 5px 0 !important;
          font-size: 0.9rem !important;
          background: white !important;
        }
      }

      .test-preview {
        background: white;
        border-radius: 20px;
        padding: 40px;
        margin-top: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        display: none;
      }

      .test-preview.show {
        display: block;
      }

      .test-header {
        text-align: center;
        border-bottom: 3px solid #667eea;
        padding-bottom: 20px;
        margin-bottom: 30px;
      }

      .test-header h2 {
        color: #667eea;
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .test-details {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 15px;
        font-size: 1rem;
        color: #666;
      }

      .question-section {
        margin-bottom: 40px;
      }

      .question-section h3 {
        color: #667eea;
        font-size: 1.5rem;
        margin-bottom: 20px;
        padding: 10px;
        background: #f0f0f0;
        border-radius: 10px;
      }

      .question {
        margin-bottom: 30px;
        padding: 20px;
        border-left: 4px solid #667eea;
        background: #f9f9f9;
        border-radius: 10px;
      }

      .question img {
        max-width: 100%;
        height: auto;
        margin: 15px 0;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .answer {
        color: #00b894;
        font-weight: bold;
        margin-top: 10px;
        padding: 10px;
        background: #e8f8f5;
        border-radius: 5px;
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2rem;
        }

        .info-grid,
        .chapters-grid {
          grid-template-columns: 1fr;
        }

        .action-buttons {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <button class="back-btn" onclick="window.history.back()">← Back</button>

    <div class="header">
      <h1>📝 Test Generator</h1>
      <p class="subtitle">Create a custom test by selecting chapters</p>
    </div>

    <div class="container">
      <!-- Test Information -->
      <div class="test-info">
        <h2>📋 Test Information</h2>
        <div class="info-grid">
          <div class="info-field">
            <label for="testName">Test Name</label>
            <input type="text" id="testName" placeholder="e.g., Grammar Quiz 1" value="Grammar Test - Class 2" />
          </div>
          <div class="info-field">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" placeholder="Student's Name" />
          </div>
          <div class="info-field">
            <label for="testDate">Date</label>
            <input type="date" id="testDate" />
          </div>
          <div class="info-field">
            <label for="testDuration">Test Duration (mins)</label>
            <input type="number" id="testDuration" placeholder="e.g., 60" value="60" />
          </div>
          <div class="info-field">
            <label for="totalMarks">Total Marks</label>
            <input type="number" id="totalMarks" placeholder="e.g., 100" value="100" />
          </div>
          <div class="info-field">
            <label for="questionType">Question Type</label>
            <select id="questionType">
              <option value="teacher">Teacher (with answers)</option>
              <option value="student">Student (without answers)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Chapters Selection -->
      <div class="chapters-section">
        <h2>📚 Select Topics</h2>

        <!-- Grammar Section -->
        <h3 style="color: #667eea; margin: 30px 0 15px 0; font-size: 1.5rem; font-weight: bold">📝 Grammar</h3>
        <div class="chapters-grid">
          <label class="chapter-card" data-chapter="g1" data-type="grammar">
            <input type="checkbox" id="g1" />
            <span class="chapter-number">Grammar 1</span>
            <h3>Nouns</h3>
            <p>Naming words</p>
          </label>

          <label class="chapter-card" data-chapter="g2" data-type="grammar">
            <input type="checkbox" id="g2" />
            <span class="chapter-number">Grammar 2</span>
            <h3>Proper and Common Nouns</h3>
            <p>Types of nouns</p>
          </label>

          <label class="chapter-card" data-chapter="g3" data-type="grammar">
            <input type="checkbox" id="g3" />
            <span class="chapter-number">Grammar 3</span>
            <h3>One and Many</h3>
            <p>Singular and plural</p>
          </label>

          <label class="chapter-card" data-chapter="g4" data-type="grammar">
            <input type="checkbox" id="g4" />
            <span class="chapter-number">Grammar 4</span>
            <h3>A, An and The</h3>
            <p>Articles</p>
          </label>

          <label class="chapter-card" data-chapter="g5" data-type="grammar">
            <input type="checkbox" id="g5" />
            <span class="chapter-number">Grammar 5</span>
            <h3>Male and Female</h3>
            <p>Gender</p>
          </label>

          <label class="chapter-card" data-chapter="g6" data-type="grammar">
            <input type="checkbox" id="g6" />
            <span class="chapter-number">Grammar 6</span>
            <h3>Pronouns</h3>
            <p>Replacing nouns</p>
          </label>

          <label class="chapter-card" data-chapter="g7" data-type="grammar">
            <input type="checkbox" id="g7" />
            <span class="chapter-number">Grammar 7</span>
            <h3>Adjectives</h3>
            <p>Describing words</p>
          </label>

          <label class="chapter-card" data-chapter="g8" data-type="grammar">
            <input type="checkbox" id="g8" />
            <span class="chapter-number">Grammar 8</span>
            <h3>Possessives</h3>
            <p>Ownership</p>
          </label>

          <label class="chapter-card" data-chapter="g9" data-type="grammar">
            <input type="checkbox" id="g9" />
            <span class="chapter-number">Grammar 9</span>
            <h3>Action Words</h3>
            <p>Verbs</p>
          </label>

          <label class="chapter-card" data-chapter="g10" data-type="grammar">
            <input type="checkbox" id="g10" />
            <span class="chapter-number">Grammar 10</span>
            <h3>Being Words</h3>
            <p>Is, am, are, was, were</p>
          </label>

          <label class="chapter-card" data-chapter="g11" data-type="grammar">
            <input type="checkbox" id="g11" />
            <span class="chapter-number">Grammar 11</span>
            <h3>Having Verbs</h3>
            <p>Has, have, had</p>
          </label>

          <label class="chapter-card" data-chapter="g12" data-type="grammar">
            <input type="checkbox" id="g12" />
            <span class="chapter-number">Grammar 12</span>
            <h3>Simple Present Tense</h3>
            <p>Present actions</p>
          </label>

          <label class="chapter-card" data-chapter="g13" data-type="grammar">
            <input type="checkbox" id="g13" />
            <span class="chapter-number">Grammar 13</span>
            <h3>Simple Past Tense</h3>
            <p>Past actions</p>
          </label>

          <label class="chapter-card" data-chapter="g14" data-type="grammar">
            <input type="checkbox" id="g14" />
            <span class="chapter-number">Grammar 14</span>
            <h3>Present Continuous Tense</h3>
            <p>Ongoing actions</p>
          </label>

          <label class="chapter-card" data-chapter="g15" data-type="grammar">
            <input type="checkbox" id="g15" />
            <span class="chapter-number">Grammar 15</span>
            <h3>Adverbs</h3>
            <p>Describing actions</p>
          </label>

          <label class="chapter-card" data-chapter="g16" data-type="grammar">
            <input type="checkbox" id="g16" />
            <span class="chapter-number">Grammar 16</span>
            <h3>Position Words</h3>
            <p>Prepositions</p>
          </label>

          <label class="chapter-card" data-chapter="g17" data-type="grammar">
            <input type="checkbox" id="g17" />
            <span class="chapter-number">Grammar 17</span>
            <h3>Joining Words</h3>
            <p>Conjunctions</p>
          </label>

          <label class="chapter-card" data-chapter="g18" data-type="grammar">
            <input type="checkbox" id="g18" />
            <span class="chapter-number">Grammar 18</span>
            <h3>The Comma</h3>
            <p>Punctuation</p>
          </label>

          <label class="chapter-card" data-chapter="g19" data-type="grammar">
            <input type="checkbox" id="g19" />
            <span class="chapter-number">Grammar 19</span>
            <h3>The Apostrophe</h3>
            <p>Punctuation</p>
          </label>

          <label class="chapter-card" data-chapter="g20" data-type="grammar">
            <input type="checkbox" id="g20" />
            <span class="chapter-number">Grammar 20</span>
            <h3>Capital Letters</h3>
            <p>Capitalization rules</p>
          </label>

          <label class="chapter-card" data-chapter="g21" data-type="grammar">
            <input type="checkbox" id="g21" />
            <span class="chapter-number">Grammar 21</span>
            <h3>End Punctuation Marks</h3>
            <p>Sentence endings</p>
          </label>
        </div>

        <!-- Vocabulary Section -->
        <h3 style="color: #667eea; margin: 30px 0 15px 0; font-size: 1.5rem; font-weight: bold">📚 Vocabulary</h3>
        <div class="chapters-grid">
          <label class="chapter-card" data-chapter="v1" data-type="vocabulary">
            <input type="checkbox" id="v1" />
            <span class="chapter-number">Vocabulary 1</span>
            <h3>Opposites</h3>
            <p>Antonyms</p>
          </label>

          <label class="chapter-card" data-chapter="v2" data-type="vocabulary">
            <input type="checkbox" id="v2" />
            <span class="chapter-number">Vocabulary 2</span>
            <h3>Similar Words</h3>
            <p>Synonyms</p>
          </label>

          <label class="chapter-card" data-chapter="v3" data-type="vocabulary">
            <input type="checkbox" id="v3" />
            <span class="chapter-number">Vocabulary 3</span>
            <h3>Compound Words</h3>
            <p>Combined words</p>
          </label>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="btn btn-preview" onclick="previewTest()">👁️ Preview Test</button>
        <button class="btn btn-print" onclick="printTest()">🖨️ Print Test</button>
      </div>

      <!-- Test Preview -->
      <div class="test-preview" id="testPreview">
        <div class="test-header">
          <h2 id="previewTestName">Grammar Test - Class 2</h2>
          <div class="test-details">
            <span><strong>Name:</strong> <span id="previewStudentName">_________________</span></span>
            <span><strong>Date:</strong> <span id="previewDate">_________________</span></span>
            <span><strong>Score:</strong> _____ / _____</span>
          </div>
        </div>
        <div id="questionsContainer"></div>
      </div>
    </div>

    <script>
      // Set today's date
      document.getElementById("testDate").valueAsDate = new Date();

      // Question database
      const questions = {
        g1: [{ text: "Nouns", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 1: Nouns.png"], answer: "Naming words" }],
        g2: [{ text: "Proper and Common Nouns", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 2: Proper and Common Nouns.png"], answer: "Types of nouns" }],
        g3: [{ text: "One and Many", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 3: One and Many.png"], answer: "Singular and plural forms" }],
        g4: [{ text: "A, An and The", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 4: A, An and The.png"], answer: "Article usage" }],
        g5: [{ text: "Male and Female", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 5: Male and Female.png"], answer: "Gender" }],
        g6: [{ text: "Pronouns", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 6: Pronouns.png"], answer: "Replacing nouns" }],
        g7: [{ text: "Adjectives", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 7: Adjectives.png"], answer: "Describing words" }],
        g8: [{ text: "Possessives", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 8: Possessives.png"], answer: "Showing ownership" }],
        g9: [{ text: "Action Words", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 9: Action Words.png"], answer: "Verbs" }],
        g10: [{ text: "Being Words", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 10: Being Words.png"], answer: "Is, am, are, was, were" }],
        g11: [{ text: "Having Verbs", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 11: Having Verbs.png"], answer: "Has, have, had" }],
        g12: [{ text: "Simple Present Tense", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 12: Simple Present Tense.png"], answer: "Present actions" }],
        g13: [{ text: "Simple Past Tense", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 13: Simple Past Tense.png"], answer: "Past actions" }],
        g14: [{ text: "Present Continuous Tense", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 14: Present Continuous Tense.png"], answer: "Ongoing actions" }],
        g15: [{ text: "Adverbs", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 15: Adverbs.png"], answer: "Describing actions" }],
        g16: [{ text: "Position Words", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 16: Position Words.png"], answer: "Prepositions" }],
        g17: [{ text: "Joining Words", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 17: Joining Words.png"], answer: "Conjunctions" }],
        g18: [{ text: "The Comma", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 18: The Comma.png"], answer: "Punctuation mark" }],
        g19: [{ text: "The Apostrophe", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 19: The Apostrophe.png"], answer: "Punctuation mark" }],
        g20: [{ text: "Capital Letters", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 20: Capital Letters.png"], answer: "Capitalization rules" }],
        g21: [{ text: "End Punctuation Marks", images: ["../../../assets/images/test-generator/class-2/Grammar – Chapter 21: End Punctuation Marks.png"], answer: "Period, question mark, exclamation" }],
        v1: [{ text: "Opposites", images: ["../../../assets/images/test-generator/class-2/Vocabulary – Chapter 1: Opposites.png"], answer: "Antonyms" }],
        v2: [{ text: "Similar Words", images: ["../../../assets/images/test-generator/class-2/Vocabulary – Chapter 2: Similar Words.png"], answer: "Synonyms" }],
        v3: [{ text: "Compound Words", images: ["../../../assets/images/test-generator/class-2/Vocabulary – Chapter 3: Compound Words.png"], answer: "Combined words" }],
      };

      function previewTest() {
        const testName = document.getElementById("testName").value || "Grammar Test";
        const studentName = document.getElementById("studentName").value;
        const testDate = document.getElementById("testDate").value;

        document.getElementById("previewTestName").textContent = testName;
        const testDuration = document.getElementById("testDuration").value;
        const totalMarks = document.getElementById("totalMarks").value;
        const questionType = document.getElementById("questionType").value;

        document.getElementById("previewTestName").textContent = testName;
        document.getElementById("previewStudentName").textContent = studentName || "_________________";
        document.getElementById("previewDate").textContent = testDate || "_________________";

        const questionsContainer = document.getElementById("questionsContainer");
        questionsContainer.innerHTML = "";

        let questionNumber = 1;
        const selectedChapters = document.querySelectorAll(".chapter-card:has(input:checked)");

        if (selectedChapters.length === 0) {
          alert("Please select at least one chapter!");
          return;
        }

        selectedChapters.forEach((card) => {
          const chapterId = card.dataset.chapter;
          if (questions[chapterId]) {
            const sectionDiv = document.createElement("div");
            sectionDiv.className = "question-section";

            const chapterType = card.dataset.type;
            const chapterTitle = card.querySelector("h3").textContent;

            let sectionLabel = "";
            if (chapterType === "grammar") sectionLabel = "📝 Grammar";
            else if (chapterType === "vocabulary") sectionLabel = "📚 Vocabulary";

            sectionDiv.innerHTML = `<h3>${sectionLabel} - ${chapterTitle}</h3>`;

            questions[chapterId].forEach((q) => {
              const questionDiv = document.createElement("div");
              questionDiv.className = "question";

              let questionHTML = `<p><strong>Q${questionNumber}.</strong> ${q.text}</p>`;

              q.images.forEach((img) => {
                questionHTML += `<img src="${img}" alt="Question Image">`;
              });

              // Show answer only for teacher version
              if (questionType === "teacher") {
                questionHTML += `<div class="answer">Answer: ${q.answer}</div>`;
              }

              questionDiv.innerHTML = questionHTML;
              sectionDiv.appendChild(questionDiv);
              questionNumber++;
            });

            questionsContainer.appendChild(sectionDiv);
          }
        });

        document.getElementById("testPreview").classList.add("show");
        document.getElementById("testPreview").scrollIntoView({ behavior: "smooth" });
      }

      function printTest() {
        previewTest();
        setTimeout(() => {
          window.print();
        }, 500);
      }
    </script>
  </body>
</html>
