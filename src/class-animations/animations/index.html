<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grammar Fun Videos - Class 1</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        min-height: 100vh;
        padding: 20px;
        overflow-x: hidden;
      }

      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
      }

      .back-btn:hover {
        background: white;
        transform: translateX(-5px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      .header { text-align: center; margin-bottom: 30px; }

      h1 {
        color: white;
        font-size: 3rem;
        margin: 40px 0 10px;
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
      }

      .subtitle {
        color: white;
        font-size: 1.3rem;
        margin-bottom: 40px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .section-label {
        color: white;
        font-size: 1.5rem;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        max-width: 1400px;
        margin: 30px auto 10px;
        padding: 0 20px;
      }

      .videos-container {
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 25px;
        padding: 0 20px 20px;
      }

      .video-card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .video-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      .video-thumbnail {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        overflow: hidden;
      }

      .video-thumbnail video {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
      }

      .play-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
      }

      .video-card:hover .play-overlay { background: rgba(0, 0, 0, 0.5); }

      .play-button {
        width: 70px;
        height: 70px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      .video-card:hover .play-button { transform: scale(1.1); background: white; }

      .play-button svg { width: 30px; height: 30px; margin-left: 4px; }

      .video-info { padding: 15px; }

      .video-title {
        font-size: 1.1rem;
        font-weight: bold;
        color: #333;
        margin-bottom: 5px;
        line-height: 1.3;
      }

      .video-description { font-size: 0.9rem; color: #666; line-height: 1.4; }

      @media (max-width: 768px) {
        h1 { font-size: 2rem; }
        .subtitle { font-size: 1rem; }
        .videos-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .play-button { width: 50px; height: 50px; }
        .play-button svg { width: 20px; height: 20px; }
      }
    </style>
  </head>
  <body>
    <button class="back-btn" onclick="window.history.back()">&#8592; Back</button>

    <div class="header">
      <h1>&#127916; Grammar Fun Videos - Class 1 &#128218;</h1>
      <p class="subtitle">Click on any topic to watch and learn!</p>
    </div>

    <div id="root"></div>

    <script>
      const BASE = '../../../../assets/videos/class-1/';

      const SECTIONS = [
        {
          label: '&#128221; Grammar',
          videos: [
            { file: 'Naming Words - People.mp4',           desc: 'Nouns for people!' },
            { file: 'Naming Words - Places.mp4',           desc: 'Nouns for places!' },
            { file: 'Naming Words - Animals.mp4',          desc: 'Nouns for animals!' },
            { file: 'Naming Words - Things.mp4',           desc: 'Nouns for things!' },
            { file: 'Naming Words - Revision.mp4',         desc: 'Review all naming words!' },
            { file: 'One and Many.mp4',                    desc: 'Singular and plural!' },
            { file: 'A or An.mp4',                         desc: 'Using A and An!' },
            { file: 'This is That is.mp4',                 desc: 'Demonstratives - singular!' },
            { file: 'These are Those are.mp4',             desc: 'Demonstratives - plural!' },
            { file: 'Male or Female - People.mp4',         desc: 'Gender for people!' },
            { file: 'Male or Female - Animals.mp4',        desc: 'Gender for animals!' },
            { file: 'Pronouns.mp4',                        desc: 'I, you, he, she, it...' },
            { file: 'Describing Words.mp4',                desc: 'Adjectives explained!' },
            { file: 'Action Words.mp4',                    desc: 'Verbs - doing words!' },
            { file: 'Being Verbs.mp4',                     desc: 'Is, am, are explained!' },
            { file: 'Having Verbs.mp4',                    desc: 'Has and have!' },
            { file: 'Actions that Happen Every Day.mp4',   desc: 'Simple present tense!' },
            { file: 'Actions that Happened Before Now.mp4',desc: 'Simple past tense!' },
            { file: 'The Sentence.mp4',                    desc: 'Sentence structure!' },
            { file: 'Statements and Questions.mp4',        desc: 'Types of sentences!' },
            { file: 'Joining Words.mp4',                   desc: 'Conjunctions!' },
            { file: 'Position Words.mp4',                  desc: 'Prepositions!' },
          ]
        },
        {
          label: '&#128214; Comprehension',
          videos: [
            { file: 'Diwali.mp4',                          desc: 'Reading comprehension!' },
            { file: 'The Ant and the Grasshopper.mp4',     desc: 'Reading comprehension!' },
            { file: 'The Lion.mp4',                        desc: 'Reading comprehension!' },
            { file: 'The Monsoon Season.mp4',              desc: 'Reading comprehension!' },
            { file: 'Picture Comprehension.mp4',           desc: 'Visual comprehension!' },
          ]
        },
        {
          label: '&#128218; Vocabulary',
          videos: [
            { file: 'Alphabetical Order.mp4',              desc: 'ABC ordering!' },
            { file: 'Opposites.mp4',                       desc: 'Antonyms!' },
            { file: 'Similar Words.mp4',                   desc: 'Synonyms!' },
            { file: 'Compound Words.mp4',                  desc: 'Combined words!' },
            { file: 'One-word Substitution.mp4',           desc: 'Replace phrases!' },
            { file: 'Homes of Animals.mp4',                desc: 'Animal habitats!' },
            { file: 'Sounds of Animals.mp4',               desc: 'Animal sounds!' },
          ]
        }
      ];

      const PLAY_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;

      function buildPage() {
        const root = document.getElementById('root');
        SECTIONS.forEach(({ label, videos }) => {
          root.innerHTML += `<div class="section-label">${label}</div>`;
          const grid = document.createElement('div');
          grid.className = 'videos-container';
          videos.forEach(({ file, desc }) => {
            const title = file.replace('.mp4', '');
            const path = BASE + file;
            grid.innerHTML += `
              <div class="video-card" onclick="playVideo('${path.replace(/'/g, "\\'")}')">
                <div class="video-thumbnail">
                  <video preload="metadata" muted>
                    <source src="${path}" type="video/mp4" />
                  </video>
                  <div class="play-overlay">
                    <div class="play-button">${PLAY_SVG}</div>
                  </div>
                </div>
                <div class="video-info">
                  <h3 class="video-title">${title}</h3>
                  <p class="video-description">${desc}</p>
                </div>
              </div>`;
          });
          root.appendChild(grid);
        });
      }

      function playVideo(videoPath) {
        window.open(videoPath);
      }

      buildPage();

      document.addEventListener('DOMContentLoaded', function () {
        const videos = document.querySelectorAll('.video-thumbnail video');
        videos.forEach(video => {
          video.load();
          video.addEventListener('loadedmetadata', function () { this.currentTime = 0.5; });
          video.addEventListener('loadeddata', function () {
            if (this.currentTime === 0) this.currentTime = 0.5;
          });
        });
      });
    </script>
  </body>
</html>
