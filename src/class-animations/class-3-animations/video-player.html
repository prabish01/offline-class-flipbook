<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class 3 Animation Player</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: "Arial", sans-serif;
      }
      .video-container {
        width: 90%;
        max-width: 1200px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 30px;
      }
      .video-header {
        text-align: center;
        margin-bottom: 20px;
      }
      .video-header h1 {
        color: #667eea;
        font-size: 2.5rem;
        margin-bottom: 10px;
      }
      .video-header p {
        color: #666;
        font-size: 1.2rem;
      }
      .video-wrapper {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%; /* 16:9 aspect ratio */
        background: #000;
        border-radius: 15px;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .video-wrapper video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-top: 20px;
      }
      .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 50px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .btn-back {
        background: #ff6b6b;
        color: white;
      }
      .btn-back:hover {
        background: #ff5252;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
      }
      .btn-menu {
        background: #667eea;
        color: white;
      }
      .btn-menu:hover {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }
      #logo {
        width: 120px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="video-container">
      <div class="video-header">
        <h1 id="videoTitle">Class 3 Animation</h1>
        <p id="videoDescription">Educational Content</p>
      </div>

      <div class="video-wrapper">
        <video id="videoPlayer" controls autoplay>
          <source id="videoSource" src="" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>

      <div class="controls">
        <button class="btn btn-back" onclick="goBack()">← Back to Tree</button>
        <button class="btn btn-menu" onclick="goToMenu()">🏠 Main Menu</button>
      </div>
    </div>

    <script>
      // Video mapping - organized like flipbook pages
      const videos = {
        1: { title: "Nouns", file: "Nouns.mp4", description: "Learn about Nouns" },
        2: { title: "Nouns and Pronouns", file: "Nouns and Pronouns.mp4", description: "Understanding Nouns and Pronouns" },
        3: { title: "Verbs", file: "Verbs.mp4", description: "Learn about Verbs" },
        4: { title: "Adjectives", file: "Adjectives.mp4", description: "Understanding Adjectives" },
        5: { title: "Adverbs", file: "Adverbs.mp4", description: "Learn about Adverbs" },
        6: { title: "Prepositions", file: "Prepositions.mp4", description: "Understanding Prepositions" },
        7: { title: "Conjunctions", file: "Conjunctions.mp4", description: "Learn about Conjunctions" },
        8: { title: "A, An, The", file: "A, An, The.mp4", description: "Articles in English" },
        9: { title: "Simple Present Tense", file: "Simple Present Tense.mp4", description: "Understanding Present Tense" },
        10: { title: "Simple Past Tense", file: "Simple Past Tense.mp4", description: "Understanding Past Tense" },
        11: { title: "Simple Future Tense", file: "Simple Future Tense.mp4", description: "Understanding Future Tense" },
        12: { title: "Present Continuous Tense", file: "Present Continuous Tense.mp4", description: "Present Continuous Tense" },
        13: { title: "Past Continuous Tense", file: "Past Continuous Tense.mp4", description: "Past Continuous Tense" },
        14: { title: "The Sentence", file: "The Sentence.mp4", description: "Understanding Sentences" },
        15: { title: "Subject and Predicate", file: "Subject and Predicate.mp4", description: "Parts of a Sentence" },
        16: { title: "Subject and Object", file: "Subject and Object.mp4", description: "Subject and Object" },
        17: { title: "Punctuation Marks and Capital Letters", file: "Punctuation Marks and Capital Letters.mp4", description: "Punctuation Rules" },
        18: { title: "Comparison of Adjectives", file: "Comparison of Adjectives.mp4", description: "Comparing Adjectives" },
        19: { title: "Countable and Uncountable Nouns", file: "Countable and Uncountable Nouns.mp4", description: "Types of Nouns" },
        20: { title: "Prefixes", file: "Prefixes.mp4", description: "Understanding Prefixes" },
        21: { title: "Similes", file: "Similes.mp4", description: "Learn about Similes" },
        22: { title: "Sound Words", file: "Sound Words.mp4", description: "Onomatopoeia" },
        23: { title: "Phrasal Words", file: "Phrasal Words.mp4", description: "Phrasal Verbs" },
        24: { title: "Homophones", file: "Homophones.mp4", description: "Words that sound alike" },
        25: { title: "Similar Words", file: "Similar Words.mp4", description: "Synonyms" },
        26: { title: "The Thirsty Crow", file: "The Thirsty Crow.mp4", description: "Story Time" },
        27: { title: "My Pet Dog", file: "My Pet Dog.mp4", description: "Story Time" },
        28: { title: "The Little Raindrops", file: "The Little Raindrops.mp4", description: "Story Time" },
      };

      // Get video number from URL parameter
      const urlParams = new URLSearchParams(window.location.search);
      const videoNum = urlParams.get("video");

      // Load the selected video
      if (videoNum && videos[videoNum]) {
        const video = videos[videoNum];
        document.getElementById("videoTitle").textContent = video.title;
        document.getElementById("videoDescription").textContent = video.description;
        document.getElementById("videoSource").src = `../../../assets/videos/class-3/${video.file}`;
        document.getElementById("videoPlayer").load();
      } else {
        document.getElementById("videoTitle").textContent = "Video Not Found";
        document.getElementById("videoDescription").textContent = "Please select a video from the tree";
      }

      function goBack() {
        window.history.back();
      }

      function goToMenu() {
        window.location.href = "../../class-menus/class-3-menu/index.html";
      }
    </script>
  </body>
</html>
