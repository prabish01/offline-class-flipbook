<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class 2 Animations - Coming Soon</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow: hidden;
        position: relative;
      }

      /* Animated stars */
      .star {
        position: absolute;
        color: #ffd700;
        font-size: 2rem;
        animation: twinkle 2s ease-in-out infinite;
        text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ffd700;
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      .star:nth-child(1) {
        top: 10%;
        left: 15%;
        animation-delay: 0s;
      }
      .star:nth-child(2) {
        top: 20%;
        right: 20%;
        animation-delay: 0.5s;
      }
      .star:nth-child(3) {
        bottom: 15%;
        left: 10%;
        animation-delay: 1s;
      }
      .star:nth-child(4) {
        bottom: 25%;
        right: 15%;
        animation-delay: 1.5s;
      }
      .star:nth-child(5) {
        top: 50%;
        left: 5%;
        animation-delay: 0.3s;
      }
      .star:nth-child(6) {
        top: 40%;
        right: 8%;
        animation-delay: 0.8s;
      }

      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      }

      .back-btn:hover {
        background: white;
        transform: translateX(-5px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      .container {
        text-align: center;
        background: rgba(255, 255, 255, 0.95);
        padding: 60px 40px;
        border-radius: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 600px;
        animation: fadeIn 1s ease-in;
        z-index: 10;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .icon {
        font-size: 8rem;
        margin-bottom: 20px;
        animation: bounce 2s ease-in-out infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      h1 {
        color: #667eea;
        font-size: 3rem;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      }

      .subtitle {
        color: #764ba2;
        font-size: 1.8rem;
        margin-bottom: 15px;
        font-weight: bold;
      }

      p {
        color: #666;
        font-size: 1.2rem;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .emoji-row {
        font-size: 2.5rem;
        margin-top: 30px;
        letter-spacing: 10px;
      }

      @media (max-width: 768px) {
        .container {
          padding: 40px 25px;
        }

        h1 {
          font-size: 2rem;
        }

        .subtitle {
          font-size: 1.3rem;
        }

        .icon {
          font-size: 5rem;
        }

        p {
          font-size: 1rem;
        }
      }
    </style>
  </head>

  <body>
    <!-- Animated stars -->
    <div class="star">⭐</div>
    <div class="star">✨</div>
    <div class="star">⭐</div>
    <div class="star">✨</div>
    <div class="star">⭐</div>
    <div class="star">✨</div>

    <button class="back-btn" onclick="window.history.back()">← Back</button>

    <div class="container">
      <div class="icon">🎬</div>
      <h1>Class 2 Animations</h1>
      <div class="subtitle">Coming Soon! 🚀</div>
      <p>
        We're working hard to create amazing grammar videos for Class 2!
        <br />
        Check back soon for exciting new content!
      </p>
      <div class="emoji-row">📚 🎨 🌟 🎪</div>
    </div>
  </body>
</html>
