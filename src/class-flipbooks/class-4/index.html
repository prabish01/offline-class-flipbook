<!-- PDF Viewer Overlay -->
<div id="pdfOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:3000;flex-direction:column;">
	<div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:3001;">
		<span id="pdfCloseBtn" style="display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#ff6b9d 0%,#ffa07a 50%,#ffd93d 100%);color:white;border-radius:1vw;box-shadow:0px 4px 12px rgba(0,0,0,0.3);padding:0.5vw 1.2vw;cursor:pointer;font-family:'Comic Sans MS',cursive;font-weight:700;font-size:1vw;white-space:nowrap;border:2px solid white;">&#8592; Flip View</span>
	</div>
	<iframe id="pdfFrame" src="" style="width:100%;height:100%;border:none;" allowfullscreen></iframe>
</div>

<script>
(function() {
	var pdfOpen = false;
	var toggleBtn = document.getElementById('pdfToggle');
	var overlay   = document.getElementById('pdfOverlay');
	var frame     = document.getElementById('pdfFrame');
	var closeBtn  = document.getElementById('pdfCloseBtn');
	var pdfSrc    = '../../../assets/pages/class-4/Master_Book_4_Grammar_Frolics_final.pdf';

	function openPdf() {
		if (!frame.src || frame.src === window.location.href) frame.src = pdfSrc;
		overlay.style.display = 'flex';
		pdfOpen = true;
		toggleBtn.textContent = 'Flip View';
		toggleBtn.style.background = 'linear-gradient(135deg, #ff6b9d 0%, #ffa07a 50%, #ffd93d 100%)';
		toggleBtn.style.color = 'white';
	}

	function closePdf() {
		overlay.style.display = 'none';
		pdfOpen = false;
		toggleBtn.textContent = 'PDF View';
		toggleBtn.style.background = 'white';
		toggleBtn.style.color = '#FF6B9D';
	}

	toggleBtn.addEventListener('click', function() { pdfOpen ? closePdf() : openPdf(); });
	closeBtn.addEventListener('click', closePdf);
})();
</script>
