<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grammar Fun Videos - Class 1</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        min-height: 100vh;
        padding: 20px;
        overflow-x: hidden;
      }

      .header { text-align: center; margin-bottom: 30px; position: relative; }

      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
      }

      .back-btn:hover {
        background: white;
        transform: translateX(-5px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      h1 { color: white; font-size: 3rem; margin: 40px 0 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.3); }
      .subtitle { color: white; font-size: 1.3rem; margin-bottom: 40px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

      .videos-container {
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 25px;
        padding: 20px;
      }

      .video-card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .video-card:hover { transform: translateY(-8px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }

      .video-thumbnail {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        overflow: hidden;
      }

      .video-thumbnail video {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
      }

      .play-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
      }

      .video-card:hover .play-overlay { background: rgba(0, 0, 0, 0.5); }

      .play-button {
        width: 70px; height: 70px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      .video-card:hover .play-button { transform: scale(1.1); background: white; }
      .play-button svg { width: 30px; height: 30px; margin-left: 4px; }

      .video-info { padding: 15px; }
      .video-title { font-size: 1.1rem; font-weight: bold; color: #333; margin-bottom: 5px; line-height: 1.3; }
      .video-description { font-size: 0.9rem; color: #666; line-height: 1.4; }

      @media (max-width: 768px) {
        h1 { font-size: 2rem; }
        .subtitle { font-size: 1rem; }
        .videos-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .play-button { width: 50px; height: 50px; }
        .play-button svg { width: 20px; height: 20px; }
        .video-title { font-size: 1rem; }
        .video-description { font-size: 0.85rem; }
      }
    </style>
  </head>
  <body>
    <button class="back-btn" onclick="window.history.back()">&#8592; Back</button>

    <div class="header">
      <h1>&#127916; Grammar Fun Videos - Class 1 &#128218;</h1>
      <p class="subtitle">Click on any topic to watch and learn!</p>
    </div>

    <div class="videos-container" id="videos-container"></div>

    <script>
      const BASE = '../assets/videos/';

      const VIDEOS = [
        { file: 'Naming Words - People.mp4',              desc: 'Names of people around us!' },
        { file: 'Naming Words - Places.mp4',              desc: 'Names of places we know!' },
        { file: 'Naming Words - Animals.mp4',             desc: 'Names of animals!' },
        { file: 'Naming Words - Things.mp4',              desc: 'Names of things around us!' },
        { file: 'One and Many.mp4',                       desc: 'Singular and plural!' },
        { file: 'A or An.mp4',                            desc: 'When to use A or An!' },
        { file: 'This is That is.mp4',                    desc: 'Near and far objects!' },
        { file: 'These are Those are.mp4',                desc: 'Near and far plurals!' },
        { file: 'Male or Female - People.mp4',            desc: 'Gender of people!' },
        { file: 'Male or Female - Animals.mp4',           desc: 'Gender of animals!' },
        { file: 'Pronouns.mp4',                           desc: 'Replacing naming words!' },
        { file: 'Describing Words.mp4',                   desc: 'Words that describe!' },
        { file: 'Action Words.mp4',                       desc: 'Words that show action!' },
        { file: 'Being Verbs.mp4',                        desc: 'Is, am, are!' },
        { file: 'Having Verbs.mp4',                       desc: 'Has and have!' },
        { file: 'Actions that Happen Every Day.mp4',      desc: 'Simple present tense!' },
        { file: 'Actions that Happened Before Now.mp4',   desc: 'Simple past tense!' },
        { file: 'Statements and Questions.mp4',           desc: 'Types of sentences!' },
        { file: 'Joining Words.mp4',                      desc: 'And, but, or!' },
        { file: 'Position Words.mp4',                     desc: 'In, on, under, behind!' },
        { file: 'Compound Words.mp4',                     desc: 'Two words joined together!' },
        { file: 'One-word Substitution.mp4',              desc: 'One word for many!' },
        { file: 'The Ant and the Grasshopper.mp4',        desc: 'A classic story!' },
        { file: 'The Monsoon Season.mp4',                 desc: 'About the rainy season!' },
      ];

      const PLAY_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;

      function buildGrid() {
        const container = document.getElementById('videos-container');
        VIDEOS.forEach(({ file }, i) => {
          const title = file.replace('.mp4', '');
          const path = BASE + file;
          container.innerHTML += `
            <div class="video-card" onclick="playVideo('${path.replace(/'/g, "\\'")}')">
              <div class="video-thumbnail">
                <video preload="metadata" muted>
                  <source src="${path}" type="video/mp4" />
                </video>
                <div class="play-overlay">
                  <div class="play-button">${PLAY_SVG}</div>
                </div>
              </div>
              <div class="video-info">
                <h3 class="video-title">${title}</h3>
                <p class="video-description">Chapter ${i + 1}</p>
              </div>
            </div>`;
        });
      }

      function playVideo(videoPath) {
        window.open(encodeURI(videoPath));
      }

      buildGrid();

      document.addEventListener('DOMContentLoaded', function () {
        const videos = document.querySelectorAll('.video-thumbnail video');
        videos.forEach(video => {
          video.load();
          video.addEventListener('loadedmetadata', function () { this.currentTime = 0.5; });
          video.addEventListener('loadeddata', function () {
            if (this.currentTime === 0) this.currentTime = 0.5;
          });
        });
      });
    </script>
  </body>
</html>
