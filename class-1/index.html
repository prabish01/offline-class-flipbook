<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Class 1 - Good with GRAMMAR</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="main2" style="display: block">
      <button class="back-btn" onclick="window.history.back()">← Back</button>

      <!-- Neuberg Logo -->
      <img src="shared/images/main-menu/neuberglogo.png" class="neuberg-logo" alt="Neuberg Publishing" />

      <!-- Animated stars -->
      <img src="shared/images/main-menu/star.png" class="star1" />
      <img src="shared/images/main-menu/star.png" class="star2" />
      <img src="shared/images/main-menu/star.png" class="star3" />
      <img src="shared/images/main-menu/star.png" class="star4" />

      <!-- Main Layout Container -->
      <div class="main-layout">
        <!-- Left: Book Thumbnail -->
        <div class="book-cover">
          <img src="assets/book-thumbnail/1.svg" alt="Class 1 Book Cover" />
        </div>

        <!-- Right: Title and Cards -->
        <div class="right-panel">
          <h1 class="class-heading">Class 1</h1>

          <!-- Cards Container -->
          <div class="cards-container">
            <div class="card" id="flip">
              <h3 class="card-title">Flip Book</h3>
              <p class="card-description">Read the digital book with interactive pages</p>
            </div>

            <div class="card disabled" id="anima" title="Coming Soon">
              <h3 class="card-title">Animations</h3>
              <p class="card-description">Watch fun educational videos</p>
            </div>

            <div class="card" id="test">
              <h3 class="card-title">Test Generator</h3>
              <p class="card-description">Take a test and check your learning</p>
            </div>

            <div class="card" id="worksheet">
              <h3 class="card-title">Worksheets</h3>
              <p class="card-description">View the worksheets</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
